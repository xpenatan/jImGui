name: Dispatch Build

on:
  workflow_dispatch:
    inputs:
      isRelease:
        description: "Release to maven"
        required: true
        type: boolean
jobs:
  build-and-upload:
    permissions:
      actions: write
      contents: write
    uses: ./.github/workflows/build_and_upload.yml
    with:
      isRelease: ${{ inputs.isRelease }}
      shouldUpload: true
    secrets: inherit
